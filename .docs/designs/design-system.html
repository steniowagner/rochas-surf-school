  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n<h1 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(52px,8vw,84px);line-height:.9;margin:0;text-transform:uppercase\">Sistema<br>de design<\u002Fh1>\n<p style=\"margin:16px 0 0;max-width:560px;font-size:15.5px;line-height:1.6;color:var(--ink2);text-wrap:pretty\">Os tokens, a tipografia e os componentes usados nas três apps. As três partilham a mesma linguagem visual — mudam apenas os separadores e as permissões.<\u002Fp>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"display:flex;align-items:center;gap:9px;height:44px;padding:0 18px;border-radius:9999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 12px var(--shadow)\"><i data-lucide=\"{{ themeIcon }}\" width=\"17\" height=\"17\"><\u002Fi>{{ themeLabel }}<\u002Fbutton>\n<\u002Fheader>\n\n<!-- 01 Cor -->\n<section style=\"max-width:1120px;margin:0 auto;padding:32px 32px 0\">\n<div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:6px\"><h2 style=\"font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;text-transform:uppercase;margin:0\">01 — Cor<\u002Fh2><div style=\"flex:1;height:1px;background:var(--line)\"><\u002Fdiv><\u002Fdiv>\n<p style=\"margin:0 0 22px;font-size:14px;line-height:1.55;color:var(--ink2);max-width:640px;text-wrap:pretty\">Três cores de marca: <strong style=\"color:var(--sun)\">sol<\u002Fstrong> para ações, <strong style=\"color:var(--grape)\">uva<\u002Fstrong> para destaque e seleção, <strong style=\"color:var(--lagoon)\">lagoa<\u002Fstrong> para surf e informação. O resto é areia e tinta.<\u002Fp>\n<sc-for list=\"{{ grupos }}\" as=\"g\" hint-placeholder-count=\"3\">\n<div style=\"margin-bottom:24px\">\n<div style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px\">{{ g.nome }}<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px\">\n<sc-for list=\"{{ g.cores }}\" as=\"c\" hint-placeholder-count=\"5\">\n<div style=\"border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)\">\n<div style=\"height:72px;background:{{ c.v }};border-bottom:1px solid var(--line)\"><\u002Fdiv>\n<div style=\"padding:10px 12px 12px\">\n<div style=\"font-size:13px;font-weight:800\">{{ c.n }}<\u002Fdiv>\n<div style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink2);margin-top:3px\">{{ c.v }}<\u002Fdiv>\n<div style=\"font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.4\">{{ c.u }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n\n<!-- 02 Tipografia -->\n<section style=\"max-width:1120px;margin:0 auto;padding:32px 32px 0\">\n<div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:6px\"><h2 style=\"font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;text-transform:uppercase;margin:0\">02 — Tipografia<\u002Fh2><div style=\"flex:1;height:1px;background:var(--line)\"><\u002Fdiv><\u002Fdiv>\n<p style=\"margin:0 0 22px;font-size:14px;line-height:1.55;color:var(--ink2);max-width:640px;text-wrap:pretty\">Barlow Condensed (700, maiúsculas) para títulos, horas e números. Nunito para todo o texto corrido e para os rótulos em maiúsculas espaçadas.<\u002Fp>\n<div style=\"border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden\">\n<div style=\"display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)\"><div style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)\">Número KPI<br><span style=\"font-weight:600;letter-spacing:0;text-transform:none\">BC 700 · 48–52<\u002Fspan><\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:52px;line-height:.9\">86%<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)\"><div style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)\">Hora da aula<br><span style=\"font-weight:600;letter-spacing:0;text-transform:none\">BC 700 · 38<\u002Fspan><\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;line-height:1\">09:00 – 10:30<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)\"><div style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)\">Título de ecrã<br><span style=\"font-weight:600;letter-spacing:0;text-transform:none\">BC 700 · 34 (26 com voltar)<\u002Fspan><\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1;text-transform:uppercase\">As minhas aulas<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)\"><div style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)\">Título de folha<br><span style=\"font-weight:600;letter-spacing:0;text-transform:none\">BC 700 · 30<\u002Fspan><\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1;text-transform:uppercase\">Ordenar aulas<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)\"><div style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)\">Corpo<br><span style=\"font-weight:600;letter-spacing:0;text-transform:none\">Nunito 400 · 14.5 / 1.6<\u002Fspan><\u002Fdiv><div style=\"font-size:14.5px;line-height:1.6;color:var(--ink2)\">Poucas e simples — para que as aulas corram bem para todos.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)\"><div style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)\">Linha de lista<br><span style=\"font-weight:600;letter-spacing:0;text-transform:none\">Nunito 700 · 14 + 11.5<\u002Fspan><\u002Fdiv><div><div style=\"font-size:14px;font-weight:700\">Ocupação semanal<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ink2);margin-top:2px\">Lugares ocupados e vagas por aula<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px\"><div style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)\">Rótulo de secção<br><span style=\"font-weight:600;letter-spacing:0;text-transform:none\">Nunito 800 · 11 · +.1em<\u002Fspan><\u002Fdiv><div style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)\">Sexta, 12 set<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 Forma -->\n<section style=\"max-width:1120px;margin:0 auto;padding:32px 32px 0\">\n<div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:6px\"><h2 style=\"font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;text-transform:uppercase;margin:0\">03 — Forma e espaço<\u002Fh2><div style=\"flex:1;height:1px;background:var(--line)\"><\u002Fdiv><\u002Fdiv>\n<p style=\"margin:0 0 22px;font-size:14px;line-height:1.55;color:var(--ink2);max-width:640px;text-wrap:pretty\">Margem de ecrã de 20px, 12px entre cartões, 22px entre grupos. Alvos de toque nunca abaixo de 44px.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n<div style=\"padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)\">\n<div style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:14px\">Raios<\u002Fdiv>\n<div style=\"display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap\">\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:52px;height:52px;border-radius:16px;background:var(--sand)\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink2)\">16 · botão, input<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:52px;height:52px;border-radius:20px;background:var(--sand)\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink2)\">20 · cartão<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:52px;height:52px;border-radius:28px 28px 0 0;background:var(--sand)\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink2)\">28 · folha<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:52px;height:30px;border-radius:9999px;background:var(--sand)\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink2)\">pílula<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)\">\n<div style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:14px\">Elevação<\u002Fdiv>\n<div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:64px;height:48px;border-radius:14px;background:var(--surface);box-shadow:0 2px 8px var(--shadow)\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink2)\">Botão ícone<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:64px;height:48px;border-radius:14px;background:var(--surface);box-shadow:0 3px 12px var(--shadow)\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink2)\">Cartão<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:64px;height:48px;border-radius:14px;background:var(--sun);box-shadow:0 8px 20px var(--shadow-sun)\"><\u002Fdiv><span style=\"font-size:11px;color:var(--ink2)\">Primário<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)\">\n<div style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:14px\">Ícones · Lucide, traço 2<\u002Fdiv>\n<div style=\"display:flex;gap:14px;flex-wrap:wrap;color:var(--ink)\">\n<i data-lucide=\"waves\" width=\"22\" height=\"22\"><\u002Fi><i data-lucide=\"disc\" width=\"22\" height=\"22\"><\u002Fi><i data-lucide=\"map-pin\" width=\"22\" height=\"22\"><\u002Fi><i data-lucide=\"calendar-days\" width=\"22\" height=\"22\"><\u002Fi><i data-lucide=\"clock\" width=\"22\" height=\"22\"><\u002Fi><i data-lucide=\"users\" width=\"22\" height=\"22\"><\u002Fi><i data-lucide=\"bell\" width=\"22\" height=\"22\"><\u002Fi><i data-lucide=\"star\" width=\"22\" height=\"22\"><\u002Fi><i data-lucide=\"history\" width=\"22\" height=\"22\"><\u002Fi><i data-lucide=\"shield\" width=\"22\" height=\"22\"><\u002Fi>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;color:var(--ink2);margin-top:12px;line-height:1.5\">22 na barra e cabeçalho · 18–19 em listas · 12–14 dentro de chips<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 Control cript type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { theme: 'light' };\n  componentDidMount() { this.icons(0); }\n  componentDidUpdate() { this.icons(0); }\n  icons(n) {\n    if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} }\n    else if (n < 40) setTimeout(() => this.icons(n + 1), 150);\n  }\n  renderVals() {\n    const dark = this.state.theme === 'dark';\n    const L = (l, d) => dark ? d : l;\n    const grupos = [\n      { nome: 'Marca', cores: [\n        { n: 'Sol · --sun', v: L('#F0742B', '#F58A45'), u: 'Ações primárias, hoje, separador ativo' },\n        { n: 'Sol forte · --sun-2', v: L('#D95F1B', '#E07330'), u: 'Hover e pressão do primário' },\n        { n: 'Uva · --grape', v: L('#4B2A63', '#7A4E9B'), u: 'Próxima aula, KPIs, seleção' },\n        { n: 'Lagoa · --lagoon', v: L('#21837F', '#3FA6A0'), u: 'Surf, nível, ícones de lista' },\n        { n: 'Areia escura · --tan', v: L('#D4A574', '#C49A6C'), u: 'Skate' },\n        { n: 'Céu · --sky', v: L('#7BA7BC', '#8BB8CC'), u: 'Fundo de avatares' }\n      ] },\n      { nome: 'Superfícies e texto', cores: [\n        { n: 'Página · --page', v: L('#FDF8F3', '#161B27'), u: 'Fundo de ecrã e folhas' },\n        { n: 'Superfície · --surface', v: L('#FEFCF9', '#212736'), u: 'Cartões e listas' },\n        { n: 'Areia · --sand', v: L('#F5E6D3', '#2E3444'), u: 'Trilho de ocupação, estrelas vazias' },\n        { n: 'Tinta · --ink', v: L('#3D2E1F', '#F0E6D8'), u: 'Texto principal' },\n        { n: 'Tinta 2 · --ink2', v: L('#6B5744', '#9B8E7E'), u: 'Texto secundário, rótulos' },\n        { n: 'Tinta 3 · --ink3', v: L('#B8A99A', '#5A5248'), u: 'Placeholders, ícones inativos' }\n      ] },\n      { nome: 'Estado', cores: [\n        { n: 'Sucesso · --ok', v: L('#4CAF7D', '#5BC48A'), u: 'Confirmações' },\n        { n: 'Erro · --bad', v: L('#D4574A', '#E8706A'), u: 'Cancelada, sem vagas, eliminar' },\n        { n: 'Aviso · --warn', v: L('#E8B44A', '#F0C45A'), u: 'Ocupação média' },\n        { n: 'Info · --info-t', v: L('rgba(33,131,127,.13)', 'rgba(63,166,160,.16)'), u: 'Fundo de chips lagoa' },\n        { n: 'Linha · --line', v: L('rgba(212,165,116,.28)', 'rgba(196,154,108,.14)'), u: 'Bordas e divisórias' },\n        { n: 'Borda input · --input-line', v: L('#E3D3BC', '#3E4555'), u: 'Campos e botão contorno' }\n      ] }\n    ];\n    const dias = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map((dow, i) => {\n      const on = i === 2, hj = i === 0;\n      return { dow, n: 21 + i, bg: on ? 'var(--grape)' : 'transparent', fg: on ? '#fff' : hj ? 'var(--sun)' : 'var(--ink)' };\n    });\n    const regras = [\n      { n: '01', t: 'Uma ação primária por ecrã', d: 'O sol é reservado para a ação principal. Tudo o resto usa escuro, contorno ou discreto.' },\n      { n: '02', t: 'Uva só para destaque', d: 'Próxima aula, indicadores e elementos selecionados. Nunca como fundo de secção.' },\n      { n: '03', t: 'Agrupar por dia', d: 'Listas de aulas agrupam-se por dia com um rótulo de secção — só o dia, sem contagens.' },\n      { n: '04', t: 'Números em Barlow', d: 'Horas, percentagens e notas usam sempre Barlow Condensed 700.' },\n      { n: '05', t: 'Toque de 44px', d: 'Botões de ícone, linhas de lista e dias do calendário nunca descem dos 44px.' },\n      { n: '06', t: 'Tema claro e escuro', d: 'Usar sempre os tokens — nunca cores fixas — para que ambos os temas funcionem.' }\n    ];\n    return {\n      theme: this.state.theme, grupos, dias, regras,\n      themeIcon: dark ? 'sun' : 'moon', themeLabel: dark ? 'Tema claro' : 'Tema escuro',\n      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
