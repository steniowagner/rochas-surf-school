name: Deploy staging

# By hand: run it from the Actions tab, or push to deploy/staging. workflow_dispatch only exists once this file is on
# main, so the branch also covers the first deploy (spec 079, D-11).
on:
  workflow_dispatch:
  push:
    branches: [deploy/staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: us-east-1
  IMAGE: ghcr.io/steniowagner/rochas-surf-school-backend
  HEALTH_URL: https://api-staging.rochassurfschool.com/health

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # prisma and tsx are dev dependencies, so migrations and the seed run here, not in the image (D-12).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@rochas-surf-school/backend

      # This step comes before the restart: a failed migration stops the job and the running version keeps answering.
      - name: Apply the migrations
        run: |
          DATABASE_URL=$(aws ssm get-parameter --name /rochas/staging/DATABASE_URL --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          npm run prisma:migrate:deploy -w @rochas-surf-school/backend

      - name: Seed the test accounts
        env:
          NODE_ENV: production
        run: |
          DATABASE_URL=$(aws ssm get-parameter --name /rochas/staging/DATABASE_URL --with-decryption --query Parameter.Value --output text)
          REVIEW_ACCOUNTS=$(aws ssm get-parameter --name /rochas/staging/REVIEW_ACCOUNTS --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$REVIEW_ACCOUNTS"
          export DATABASE_URL REVIEW_ACCOUNTS
          npm run prisma:seed -w @rochas-surf-school/backend

      - name: Restart the server on the new image
        env:
          INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name rochas-staging-deploy \
            --parameters "commit=$GITHUB_SHA" \
            --query Command.CommandId --output text)

          for _ in $(seq 1 60); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text
                exit 1 ;;
            esac
          done
          echo "The restart did not finish in 5 minutes"
          exit 1

      - name: Wait for the API to answer
        run: |
          for _ in $(seq 1 24); do
            curl -fsS --max-time 4 "$HEALTH_URL" && exit 0
            sleep 5
          done
          echo "$HEALTH_URL did not answer 200 within 2 minutes"
          exit 1
