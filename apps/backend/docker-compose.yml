# Backend + PostgreSQL. Run from apps/backend:
#   docker compose up --build
# Credentials come from apps/backend/.env (copy .env.example first).

name: rochas-surf-school

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME in .env}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database is reached by service name.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - '${PORT:-4000}:${PORT:-4000}'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
